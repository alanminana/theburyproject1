name: PR75 Mora visual evidence

# Evidencia visual de Mora/ClientesMora y Mora/FichaCliente (PR #75). Workflow dedicado y acotado:
# levanta el MISMO stack efimero que playwright.yml (SQL Server + app en Docker, creados y destruidos
# dentro del job), siembra un dataset 100% sintetico de Mora y corre SOLO e2e/pr75-mora-visual-evidence.spec.js.
# No toca el suite E2E general ni ninguna base persistente. Publica capturas como artefacto privado del
# workflow (no se suben PNG al repositorio).
on:
  pull_request:
    paths:
      - '.github/workflows/pr75-mora-visual.yml'
      - 'e2e/pr75-mora-visual-evidence.spec.js'
      - 'TheBuryProyect.Tests/E2ESeeding/MoraVisual*.cs'
      - 'Views/Mora/**'
      - 'wwwroot/css/mora-*.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr75-mora-visual-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT: bury-e2e-pr75
  APP_PORT_CI: 18081
  MSSQL_HOST_PORT_CI: 14331

jobs:
  visual:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (segun global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # .env EFIMERO: credenciales sinteticas generadas en este job, enmascaradas, nunca commiteadas ni
      # subidas como artefacto. Se borra siempre al final (if: always()).
      - name: Generar .env efimero (credenciales sinteticas)
        run: |
          set -euo pipefail
          gen_pw() { echo "Ee1!$(openssl rand -hex 12)"; }

          MSSQL_SA_PASSWORD=$(gen_pw)
          ERP_DB_PASSWORD=$(gen_pw)
          ERP_MIGRATION_PASSWORD=$(gen_pw)
          ADMIN_PASSWORD=$(gen_pw)

          echo "::add-mask::$MSSQL_SA_PASSWORD"
          echo "::add-mask::$ERP_DB_PASSWORD"
          echo "::add-mask::$ERP_MIGRATION_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"

          ENV_FILE="$RUNNER_TEMP/.env.pr75-mora"
          cat > "$ENV_FILE" <<EOF
          MSSQL_SA_PASSWORD='${MSSQL_SA_PASSWORD}'
          MSSQL_DATABASE=TheBuryProjectDb
          ERP_DB_USER=erp_app_ci
          ERP_DB_PASSWORD='${ERP_DB_PASSWORD}'
          ERP_MIGRATION_USER=erp_migrate_ci
          ERP_MIGRATION_PASSWORD='${ERP_MIGRATION_PASSWORD}'
          MSSQL_PID=Developer
          ADMIN_EMAIL=admin-ci@example.invalid
          ADMIN_USERNAME=admin_ci
          ADMIN_PASSWORD='${ADMIN_PASSWORD}'
          ERP_DOMAIN=ci.example.invalid
          APP_PORT=${APP_PORT_CI}
          MSSQL_HOST_PORT=${MSSQL_HOST_PORT_CI}
          EOF

          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          echo "ERP_DB_USER=erp_app_ci" >> "$GITHUB_ENV"
          echo "ERP_DB_PASSWORD=${ERP_DB_PASSWORD}" >> "$GITHUB_ENV"

      # Mismo overlay que playwright.yml: puertos solo a 127.0.0.1 y `migrate` en Development para que
      # DbInitializer.CreateTestUsersAsync siembre los usuarios de prueba sinteticos ya versionados.
      - name: Levantar stack (db -> db-init -> migrate -> app)
        run: |
          docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" \
            -f docker-compose.yml -f docker-compose.ci.yml up -d --build app

      - name: Esperar readiness de la app (/health/ready)
        run: |
          set -uo pipefail
          ok=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${APP_PORT_CI}/health/ready" || echo 000)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::La app no quedo ready dentro del timeout. Logs de diagnostico:"
            docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.ci.yml logs db db-init migrate app
            exit 1
          fi
          echo "App ready (200)"

      - name: Compilar TheBuryProyect.Tests (Release)
        run: |
          dotnet restore TheBuryProyect.Tests/TheBuryProyect.Tests.csproj
          dotnet build TheBuryProyect.Tests/TheBuryProyect.Tests.csproj -c Release --no-restore

      - name: Sembrar dataset sintetico de Mora (26 clientes, 1 ficha rica)
        env:
          E2E_SEED_CONNECTION: "Server=127.0.0.1,${{ env.MSSQL_HOST_PORT_CI }};Database=TheBuryProjectDb;User Id=${{ env.ERP_DB_USER }};Password=${{ env.ERP_DB_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: |
          dotnet test TheBuryProyect.Tests/TheBuryProyect.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~MoraVisualE2ESeedRunner.Sembrar" \
            --logger "console;verbosity=normal"
          test -s e2e/.auth/pr75-mora-seed-ids.json || { echo "::error::El seed no genero e2e/.auth/pr75-mora-seed-ids.json"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Solo el spec de evidencia, en un unico project (el spec fija sus 3 viewports con setViewportSize).
      # El project "setup" (login) corre por dependencia.
      - name: Run Playwright (solo evidencia visual de Mora)
        env:
          E2E_BASE_URL: "http://127.0.0.1:${{ env.APP_PORT_CI }}"
          E2E_USER: administrador
          E2E_PASS: "Admin123!"
          E2E_MORA_VISUAL: "1"
        run: npx playwright test e2e/pr75-mora-visual-evidence.spec.js --project=1366x768 --retries=0

      # Diagnostico solo en el log del job (donde Actions enmascara secretos); NO va al artefacto.
      - name: Logs de la app si algo fallo (diagnostico)
        if: ${{ failure() }}
        run: |
          docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.ci.yml             logs --no-color --tail=200 app || true

      # Solo PNG + manifiestos. Sin .env, cookies, storageState ni cadenas de conexion.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pr75-mora-visual-evidence
          path: |
            qa-evidence/pr75-mora-visual/*.png
            qa-evidence/pr75-mora-visual/manifest-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup (stack + .env efimero)
        if: always()
        run: |
          docker compose --env-file "$ENV_FILE" -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.ci.yml down -v || true
          rm -f "$ENV_FILE"
