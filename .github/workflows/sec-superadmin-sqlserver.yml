name: SEC SQL Server (ultimo SuperAdmin - concurrencia y atomicidad)

# PROMPT 57: ejecuta CONTRA UN SQL SERVER REAL EFIMERO la clase UltimoSuperAdminConcurrenciaSqlServerTests
# (concurrencia y atomicidad del invariante "siempre queda un SuperAdmin utilizable"). SQLite no sirve: un unico
# escritor serializa todo y esconderia la carrera. Sin QA_SEC_SUPERADMIN_SQL esas pruebas se OMITEN, y ni ci.yml ni
# fin-dev-sqlserver.yml la definen: este es el unico lugar donde dejan de ser "omitidas".
#
# Aislamiento:
#   - el contenedor se crea y se destruye DENTRO del job (con sus volumenes);
#   - credenciales sinteticas generadas en el job, enmascaradas, nunca commiteadas ni subidas como artifact;
#   - el puerto solo escucha en 127.0.0.1 del runner: sin conectividad con ninguna base de desarrollo;
#   - el catalogo se llama qa_sec_superadmin* (las pruebas se niegan a correr contra otro nombre);
#   - todos los datos los crean los propios tests.
# RCSI: las pruebas recrean el catalogo en cada escenario, asi que el modo se fija en la base `model`
# (los catalogos nuevos lo heredan) y SA-00 comprueba que el catalogo real coincide con el pedido.
# Un omitido NO es un aprobado: el paso de verificacion falla si algun escenario no figura como Passed en el TRX.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-superadmin-sqlserver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MSSQL_HOST_PORT_CI: 14341
  MSSQL_CONTAINER: bury-sec-superadmin-sql-ci

jobs:
  sqlserver-superadmin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 0 = READ COMMITTED con locks (default de SQL Server); 1 = READ_COMMITTED_SNAPSHOT (default de Azure SQL).
        rcsi: [ '0', '1' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (segun global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Levantar SQL Server efimero (credenciales sinteticas) y fijar RCSI en model
        run: |
          set -euo pipefail
          SA_PW="Ee1!$(openssl rand -hex 12)"
          echo "::add-mask::$SA_PW"
          echo "SA_PW=$SA_PW" >> "$GITHUB_ENV"
          docker run -d --name "$MSSQL_CONTAINER" \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$SA_PW" \
            -p "127.0.0.1:${MSSQL_HOST_PORT_CI}:1433" \
            mcr.microsoft.com/mssql/server:2022-latest
          READY=0
          for i in $(seq 1 60); do
            if docker exec "$MSSQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PW" -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server listo tras ${i} intentos"; READY=1; break
            fi
            sleep 3
          done
          if [ "$READY" != "1" ]; then docker logs "$MSSQL_CONTAINER" | tail -50; echo "SQL Server no arranco"; exit 1; fi
          if [ "${{ matrix.rcsi }}" = "1" ]; then
            docker exec "$MSSQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PW" -b \
              -Q "ALTER DATABASE model SET READ_COMMITTED_SNAPSHOT ON WITH ROLLBACK IMMEDIATE"
          fi
          docker exec "$MSSQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PW" -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT 'model.is_read_committed_snapshot_on=' + CAST(is_read_committed_snapshot_on AS varchar(1)) FROM sys.databases WHERE name='model'"

      - name: Restore + Build (Release)
        run: |
          dotnet restore TheBuryProyect.Tests/TheBuryProyect.Tests.csproj
          dotnet build TheBuryProyect.Tests/TheBuryProyect.Tests.csproj -c Release --no-restore

      - name: Ultimo SuperAdmin - clase completa (SA-00..SA-08)
        env:
          QA_RELEASE_TURNO: '1'
          QA_SEC_SUPERADMIN_RCSI: ${{ matrix.rcsi }}
        run: |
          set -euo pipefail
          export QA_SEC_SUPERADMIN_SQL="Server=127.0.0.1,${MSSQL_HOST_PORT_CI};Database=qa_sec_superadmin;User Id=sa;Password=${SA_PW};TrustServerCertificate=True;MultipleActiveResultSets=true"
          dotnet test TheBuryProyect.Tests/TheBuryProyect.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~UltimoSuperAdminConcurrenciaSqlServerTests" \
            --logger "trx;LogFileName=sec-superadmin-sql-rcsi${{ matrix.rcsi }}.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory ./TestResults

      # Un omitido no es un aprobado: cada escenario debe figurar con outcome="Passed", y no puede haber
      # ningun resultado que no sea Passed ni ejecutarse un numero distinto del esperado.
      - name: Verificar que se ejecutaron (no omitidos)
        if: always()
        run: |
          set -uo pipefail
          TRX=./TestResults/sec-superadmin-sql-rcsi${{ matrix.rcsi }}.trx
          if [ ! -f "$TRX" ]; then echo "No hay TRX: los escenarios no se ejecutaron"; exit 1; fi
          RC=0
          {
            echo "### Ultimo SuperAdmin en SQL Server efimero (RCSI=${{ matrix.rcsi }})"
            echo ""
            echo "| Escenario | Resultado |"
            echo "|-----------|-----------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for R in SA-00 SA-01 SA-02 SA-03 SA-04 SA-05 SA-06 SA-07 SA-08; do
            LINE=$(grep -o "<UnitTestResult [^>]*testName=\"[^\"]*\[$R\][^\"]*\"[^>]*>" "$TRX" | head -n1 || true)
            if [ -z "$LINE" ]; then OUT="NO ENCONTRADO"; else OUT=$(echo "$LINE" | grep -o 'outcome="[^"]*"' | head -n1 | cut -d'"' -f2); fi
            echo "| $R | $OUT |" >> "$GITHUB_STEP_SUMMARY"
            echo "$R -> $OUT"
            if [ "$OUT" != "Passed" ]; then RC=1; fi
          done
          TOTAL=$(grep -o '<UnitTestResult ' "$TRX" | wc -l)
          PASSED=$(grep -o '<UnitTestResult [^>]*outcome="Passed"' "$TRX" | wc -l)
          echo "Total=$TOTAL Passed=$PASSED (esperado 9/9)"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Total: $TOTAL, Passed: $PASSED (esperado 9 / 9)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" != "9" ] || [ "$PASSED" != "9" ]; then RC=1; fi
          exit $RC

      - name: Subir TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-superadmin-sql-trx-rcsi${{ matrix.rcsi }}
          path: TestResults/**/*.trx
          retention-days: 14
          if-no-files-found: warn

      # El contenedor y sus volumenes anonimos se eliminan siempre, falle o no el job.
      - name: Destruir SQL Server efimero
        if: always()
        run: |
          docker rm -f -v "$MSSQL_CONTAINER" >/dev/null 2>&1 || true
          docker ps -a --filter "name=$MSSQL_CONTAINER" --format '{{.Names}}' | wc -l
