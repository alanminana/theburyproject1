# Standalone: docker compose -f docker-compose.monitoring.yml up -d
# Prefer a separate observer host. No Docker socket and no ERP secrets.
name: bury-observer
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:3001:3001"]
    volumes: ["monitor-data:/app/data"]
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
volumes:
  monitor-data:
